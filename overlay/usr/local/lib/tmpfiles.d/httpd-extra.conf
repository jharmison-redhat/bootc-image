# /etc/httpd/logs
D   /var/log/httpd  0700    root    root    -   -
Z   /var/log/httpd  -       -       -       -   -
# /etc/httpd/state
D   /var/lib/httpd  0700    apache  apache  -   -
Z   /var/lib/httpd  -       -       -       -   -
# Image-distributed web content
C+  /var/www/html   0755    root    root    -   /usr/local/share/www/html
Z   /var/www/html   -       -       -       -   -
